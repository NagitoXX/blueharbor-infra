# /etc/rsyslog.d/90-forward.conf on the log senders (WEB02) - managed by Ansible (logging.yml)
# Forward every message to the collector over TCP. If WEB01 is down, messages wait in an
# in-memory queue (LinkedList) and rsyslog retries forever (resumeRetryCount -1).
*.* action(type="omfwd" target="10.10.20.20" port="514" protocol="tcp"
          queue.type="LinkedList" action.resumeRetryCount="-1")
