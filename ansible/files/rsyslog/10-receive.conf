# /etc/rsyslog.d/10-receive.conf on the log collector (WEB01) - managed by Ansible (logging.yml)
# Receive syslog over TCP 514 and write one file per sending host and program.
module(load="imtcp")
input(type="imtcp" port="514")
template(name="PerHost" type="string" string="/var/log/remote/%HOSTNAME%/%PROGRAMNAME%.log")
if $inputname == "imtcp" then {
  action(type="omfile" dynaFile="PerHost")
  stop
}
