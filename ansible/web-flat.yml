- name: Configure the BlueHarbor web tier
  hosts: web
  become: true
  vars:
    trackit_version: "1.0.0"
  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name: [nginx, prometheus-node-exporter]
        state: present
        update_cache: true
    - name: Deploy the status page
      ansible.builtin.template:
        src: roles/webserver/templates/index.html.j2
        dest: /var/www/html/index.html
        mode: "0644"
      notify: Reload nginx
    - name: Allow node_exporter from WEB01 only
      community.general.ufw:
        rule: allow
        port: "9100"
        proto: tcp
        from_ip: 10.10.20.20
    - name: Ensure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
