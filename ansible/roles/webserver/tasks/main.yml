---
- name: Install packages
  ansible.builtin.apt:
    name: [nginx, prometheus-node-exporter]
    state: present
    update_cache: true

- name: Deploy the status page
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    mode: "0644"
  notify: Reload nginx

- name: Allow node_exporter from the monitoring host only
  community.general.ufw:
    rule: allow
    port: "9100"
    proto: tcp
    from_ip: "{{ node_exporter_allowed_from }}"

- name: Ensure nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
