# Lab 07 (Exercise 7.4): let opsadmin open LOCAL SSH tunnels only, to reach Grafana (3000)
# and Prometheus (9090) from the admin laptop. Everyone else keeps AllowTcpForwarding no
# (20-lynis.conf). Remove this file and reload ssh to go back to the Lab 03 hardening.
Match User opsadmin
    AllowTcpForwarding local
